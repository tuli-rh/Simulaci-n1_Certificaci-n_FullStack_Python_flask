<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>BookHub - Editar Libro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/libros">📖 BookHub</a>
            <div class="navbar-nav me-auto">
                <a class="nav-link" href="/libros">Mis Libros</a>
                <a class="nav-link" href="/favoritos">Mis Favoritos</a>
            </div>
            <span class="navbar-text">Bienvenido, {{ session['usuario_nombre'] }}</span>
        </div>
    </nav>

    <div class="container" style="max-width: 600px;">
        <h2>Editar Libro</h2>

        {% with messages = get_flashed_messages(category_filter=["libro"]) %}
        {% if messages %}
        <div class="alert alert-danger">
            {% for msg in messages %}<p class="mb-0">{{ msg }}</p>{% endfor %}
        </div>
        {% endif %}
        {% endwith %}

        <form action="/libros/actualizar/{{ libro.id }}" method="POST">
            <div class="mb-3">
                <label class="form-label">Título:</label>
                <input type="text" name="titulo" value="{{ libro.titulo }}" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Autor:</label>
                <input type="text" name="autor" value="{{ libro.autor }}" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Género:</label>
                <select name="genero" class="form-select" required>
                    <option value="Novela" {% if libro.genero=='Novela' %}selected{% endif %}>Novela</option>
                    <option value="Fábula" {% if libro.genero=='Fábula' %}selected{% endif %}>Fábula</option>
                    <option value="Ciencia Ficción" {% if libro.genero=='Ciencia Ficción' %}selected{% endif %}>Ciencia
                        Ficción</option>
                    <option value="Romance" {% if libro.genero=='Romance' %}selected{% endif %}>Romance</option>
                    <option value="Desarrollo Personal" {% if libro.genero=='Desarrollo Personal' %}selected{% endif %}>
                        Desarrollo Personal</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Fecha de publicación:</label>
                <input type="date" name="fecha_publicacion" value="{{ libro.fecha_publicacion }}" class="form-control"
                    required>
            </div>
            <div class="mb-3">
                <label class="form-label">Descripción:</label>
                <textarea name="descripcion" class="form-control" rows="4" required>{{ libro.descripcion }}</textarea>
            </div>
            <button type="submit" class="btn btn-dark">Actualizar</button>
            <a href="/libros" class="btn btn-link">Cancelar</a>
        </form>
    </div>
</body>

</html>
