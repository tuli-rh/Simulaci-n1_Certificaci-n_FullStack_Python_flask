<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>BookHub - Nuevo Libro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/libros">📖 BookHub</a>
            <div class="navbar-nav me-auto">
                <a class="nav-link" href="/libros">Mis Libros</a>
                <a class="nav-link" href="/favoritos">Mis Favoritos</a>
            </div>
            <span class="navbar-text">Bienvenido, {{ session['usuario_nombre'] }}</span>
        </div>
    </nav>

    <div class="container" style="max-width: 600px;">
        <h2>Agregar Nuevo Libro</h2>

        {% with messages = get_flashed_messages(category_filter=["libro"]) %}
        {% if messages %}
        <div class="alert alert-danger">
            {% for msg in messages %}<p class="mb-0">{{ msg }}</p>{% endfor %}
        </div>
        {% endif %}
        {% endwith %}

        <form action="/libros/crear" method="POST">
            <div class="mb-3">
                <label class="form-label">Título:</label>
                <input type="text" name="titulo" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Autor:</label>
                <input type="text" name="autor" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Género:</label>
                <select name="genero" class="form-select" required>
                    <option value="">Selecciona un género</option>
                    <option value="Novela">Novela</option>
                    <option value="Fábula">Fábula</option>
                    <option value="Ciencia Ficción">Ciencia Ficción</option>
                    <option value="Romance">Romance</option>
                    <option value="Desarrollo Personal">Desarrollo Personal</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Fecha de publicación:</label>
                <input type="date" name="fecha_publicacion" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Descripción:</label>
                <textarea name="descripcion" class="form-control" rows="4" required></textarea>
            </div>
            <button type="submit" class="btn btn-dark">Guardar</button>
            <a href="/libros" class="btn btn-link">Cancelar</a>
        </form>
    </div>
</body>

</html>
